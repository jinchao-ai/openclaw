name: Monitor OpenClaw Release (Original Repo)
on:
  # 每天北京时间8:00、20:00执行（12小时间隔）
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      # 1. 安装基础依赖
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl python3 python3-pip && sudo pip3 install requests

      # 2. 动态拉取+翻译+摘要（单行Python，无YAML语法错误）
      - name: Dynamic fetch + translate + summarize
        id: dynamic-process
        run: |
          # 动态拉取最新Release
          LATEST_RELEASE=$(curl -s --fail "https://api.github.com/repos/openclaw/openclaw/releases/latest" || echo '{"tag_name":"null","name":"No Title","body":"No Description","html_url":"https://github.com/openclaw/openclaw"}')
          LATEST_VERSION=$(echo "$LATEST_RELEASE" | jq -r '.tag_name // "null"')
          LATEST_TITLE_EN=$(echo "$LATEST_RELEASE" | jq -r '.name // "无标题"')
          LATEST_BODY_EN=$(echo "$LATEST_RELEASE" | jq -r '.body // "无更新内容"')
          LATEST_URL=$(echo "$LATEST_RELEASE" | jq -r '.html_url // "https://github.com/openclaw/openclaw"')

          # ========== 核心：单行Python动态脚本（无YAML语法错误） ==========
          PYTHON_SCRIPT="import requests, re, sys; def t(tx, fl='en', tl='zh'): try: segs=re.split(r'\\n{2,}', tx); trs=[]; for s in segs[:10]: if len(s.strip())<5: continue; u=f'https://translate.googleapis.com/translate_a/single?client=gtx&sl={fl}&tl={tl}&dt=t&q={requests.utils.quote(s[:500])}'; r=requests.get(u, timeout=8); tr=''.join([i[0] for i in r.json()[0] if i[0]]); trs.append(tr); return '\\n'.join(trs) except: return tx; def e(tc, te): kp=[]; cp=[r'新增.*', r'修复.*', r'优化.*', r'支持.*', r'重构.*', r'强化.*']; for p in cp: m=re.findall(p, tc); kp.extend(m[:2]); es=re.split(r'[.!?]\\s*', te); for s in es[:30]: if re.search(r'\\b(add|fix|optimize|support|new|feature|security|performance)\\b', s.lower()): try: u=f'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh&dt=t&q={requests.utils.quote(s[:300])}'; cs=''.join([i[0] for i in requests.get(u, timeout=5).json()[0] if i[0]]); if len(cs)>10 and cs not in kp: kp.append(cs) except: continue; kp=list(dict.fromkeys(kp))[:10]; return '\\n'.join([f'{i+1}. {p}' for i,p in enumerate(kp)]); te=sys.argv[1]; be=sys.argv[2]; tc=t(te); if not tc or len(tc)<3: tc='OpenClaw 新版本发布'; bc=t(be); fp=e(bc, be); if not fp: fp='1. 本次更新包含常规优化与修复，请查看完整详情了解更多'; print(f'TITLE_CN|{tc}'); print(f'FOCUS_CN|{fp}')"

          # 执行单行Python脚本
          PROCESS_RESULT=$(python3 -c "$PYTHON_SCRIPT" "$LATEST_TITLE_EN" "$LATEST_BODY_EN")
          
          # 提取结果
          LATEST_TITLE_CN=$(echo "$PROCESS_RESULT" | grep "^TITLE_CN|" | cut -d'|' -f2)
          LATEST_FOCUS_CN=$(echo "$PROCESS_RESULT" | grep "^FOCUS_CN|" | cut -d'|' -f2)

          # 输出变量
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "title_cn=$(echo "$LATEST_TITLE_CN" | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/\\n/g')" >> $GITHUB_OUTPUT
          echo "focus_cn=$(echo "$LATEST_FOCUS_CN" | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/\\n/g')" >> $GITHUB_OUTPUT
          echo "url=$LATEST_URL" >> $GITHUB_OUTPUT

      # 3. 读取历史版本号
      - name: Get last notified version
        id: get-last
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          RESPONSE=$(curl -s -w "%{http_code}" -H "Authorization: token $PAT_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/variables/OPENCLAW_LAST_VERSION")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | head -n -1)
          LAST_VERSION=""
          if [ "$HTTP_CODE" = "200" ]; then
            LAST_VERSION=$(echo "$RESPONSE_BODY" | jq -r '.value // ""')
          fi
          echo "last_version=$LAST_VERSION" >> $GITHUB_OUTPUT

      # 4. 发送动态内容到钉钉
      - name: Send dynamic content to DingTalk
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          LATEST_VERSION: ${{ steps.dynamic-process.outputs.latest_version }}
          LAST_VERSION: ${{ steps.get-last.outputs.last_version }}
          TITLE_CN: ${{ steps.dynamic-process.outputs.title_cn }}
          FOCUS_CN: ${{ steps.dynamic-process.outputs.focus_cn }}
          URL: ${{ steps.dynamic-process.outputs.url }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$LATEST_VERSION" != "null" ] && [ "$LATEST_VERSION" != "$LAST_VERSION" ]; then
            echo "检测到新版本 $LATEST_VERSION，推送动态内容到钉钉..."
            
            # 构造钉钉消息
            JSON_PAYLOAD=$(jq -n \
              --arg ver "$LATEST_VERSION" \
              --arg title "$TITLE_CN" \
              --arg focus "$FOCUS_CN" \
              --arg url "$URL" \
              '{
                "msgtype":"text",
                "text":{"content":"🚨 OpenClaw 原仓库新版本发布 🚨\n版本号：\($ver)\n版本标题：\($title)\n\n核心更新（动态提取）：\n\($focus)\n\n查看完整详情：\($url)"}
              }')

            # 发送钉钉通知
            curl -X POST "$DINGTALK_WEBHOOK" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "$JSON_PAYLOAD"

            # 更新版本号变量
            curl -s -X DELETE -H "Authorization: token $PAT_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/variables/OPENCLAW_LAST_VERSION"
            curl -s -X POST -H "Authorization: token $PAT_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/actions/variables" \
              -d '{"name":"OPENCLAW_LAST_VERSION","value":"'$LATEST_VERSION'"}'
            
            echo "动态内容已推送至钉钉，版本号已保存"
          else
            echo "无新版本（当前版本：$LATEST_VERSION），无需推送"
          fi
