name: Monitor OpenClaw Release (Original Repo)
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      # 1. 安装依赖
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 2. 获取原仓库最新版本
      - name: Get latest release from original repo
        id: get-latest
        run: |
          LATEST_RELEASE=$(curl -s --fail "https://api.github.com/repos/openclaw/openclaw/releases/latest" || echo '{"tag_name":"null"}')
          LATEST_VERSION=$(echo "$LATEST_RELEASE" | jq -r '.tag_name // "null"')
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "最新版本号：$LATEST_VERSION"

      # 3. 读取历史版本号（用PAT调用API，兼容所有版本）
      - name: Get last notified version
        id: get-last
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}  # 改用PAT令牌
          REPO: ${{ github.repository }}
        run: |
          # 用GitHub API读取变量（兼容所有版本）
          RESPONSE=$(curl -s -H "Authorization: token $PAT_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/variables/OPENCLAW_LAST_VERSION")
          LAST_VERSION=$(echo "$RESPONSE" | jq -r '.value // ""')
          echo "last_version=$LAST_VERSION" >> $GITHUB_OUTPUT
          echo "上次推送版本号：$LAST_VERSION"

      # 4. 版本对比+发送通知+更新变量
      - name: Compare version and send DingTalk notify
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          LATEST_VERSION: ${{ steps.get-latest.outputs.latest_version }}
          LAST_VERSION: ${{ steps.get-last.outputs.last_version }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$LATEST_VERSION" != "null" ] && [ "$LATEST_VERSION" != "$LAST_VERSION" ]; then
            echo "检测到新版本 $LATEST_VERSION，开始推送通知..."
            
            # 提取完整版本信息
            LATEST_RELEASE=$(curl -s "https://api.github.com/repos/openclaw/openclaw/releases/latest")
            LATEST_TITLE=$(echo "$LATEST_RELEASE" | jq -r '.name // "无标题"')
            LATEST_DESCRIPTION=$(echo "$LATEST_RELEASE" | jq -r '.body // "无更新描述"' | tr -d '"\\' | tr '\n' ' ' | cut -c 1-300)
            LATEST_URL=$(echo "$LATEST_RELEASE" | jq -r '.html_url // "https://github.com/openclaw/openclaw"')

            # 构造合法JSON发送钉钉
            JSON_PAYLOAD=$(jq -n \
              --arg ver "$LATEST_VERSION" \
              --arg title "$LATEST_TITLE" \
              --arg desc "$LATEST_DESCRIPTION" \
              --arg url "$LATEST_URL" \
              '{
                "msgtype":"text",
                "text":{"content":"🚨 OpenClaw 原仓库新版本发布 🚨\n版本号：\($ver)\n标题：\($title)\n更新内容：\($desc)\n查看详情：\($url)"}
              }')

            curl -X POST "$DINGTALK_WEBHOOK" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "$JSON_PAYLOAD"

            # 更新仓库变量（用PAT授权，无权限兼容问题）
            echo "更新上次推送版本号为：$LATEST_VERSION"
            curl -s -X PUT -H "Authorization: token $PAT_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/actions/variables/OPENCLAW_LAST_VERSION" \
              -d '{"name":"OPENCLAW_LAST_VERSION","value":"'$LATEST_VERSION'"}'
          else
            echo "无新版本（当前版本：$LATEST_VERSION），无需推送"
          fi
