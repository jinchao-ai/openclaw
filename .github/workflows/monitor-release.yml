name: Monitor OpenClaw Release (Original Repo)
on:
  # 每天北京时间8:00、20:00执行（12小时间隔）
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      # 1. 安装依赖（jq + python + requests）
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl
          sudo apt-get install -y python3 python3-pip
          sudo pip3 install requests

      # 2. 获取最新版本+完整翻译（单行Python脚本，避免YAML语法错误）
      - name: Get latest release and full translate
        id: get-latest
        run: |
          # 获取原仓库最新Release（保留原始换行）
          LATEST_RELEASE=$(curl -s --fail "https://api.github.com/repos/openclaw/openclaw/releases/latest" || echo '{"tag_name":"null","name":"No Title","body":"No Description","html_url":"https://github.com/openclaw/openclaw"}')
          
          # 提取核心字段
          LATEST_VERSION=$(echo "$LATEST_RELEASE" | jq -r '.tag_name // "null"')
          LATEST_TITLE_EN=$(echo "$LATEST_RELEASE" | jq -r '.name // "无标题"')
          LATEST_BODY_EN=$(echo "$LATEST_RELEASE" | jq -r '.body // "无更新描述"' | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e 's/\n/\\n/g')
          LATEST_URL=$(echo "$LATEST_RELEASE" | jq -r '.html_url // "https://github.com/openclaw/openclaw"')

          # ========== 核心：单行Python翻译脚本（避免YAML多行语法错误） ==========
          TRANSLATE_CMD='import requests, json, sys; def t(t): try: return "".join([i[0] for i in requests.get("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh&dt=t&q="+requests.utils.quote(t), timeout=10).json()[0] if i[0]]) except: return t; title_cn=t(sys.argv[1]); body_cn=t(sys.argv[2]); print(f"TITLE_CN|{title_cn}"); print(f"BODY_CN|{body_cn}")'
          
          # 执行翻译（传递英文标题和正文）
          TRANSLATE_RESULT=$(python3 -c "$TRANSLATE_CMD" "$LATEST_TITLE_EN" "$LATEST_BODY_EN")
          
          # 提取翻译结果
          LATEST_TITLE_CN=$(echo "$TRANSLATE_RESULT" | grep "^TITLE_CN|" | cut -d'|' -f2 | sed -e 's/\\n/\n/g')
          LATEST_BODY_CN=$(echo "$TRANSLATE_RESULT" | grep "^BODY_CN|" | cut -d'|' -f2 | sed -e 's/\\n/\n/g')

          # 输出变量（转义换行符，适配GitHub Output）
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "title_cn=$(echo "$LATEST_TITLE_CN" | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/\\n/g')" >> $GITHUB_OUTPUT
          echo "body_cn=$(echo "$LATEST_BODY_CN" | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/\\n/g')" >> $GITHUB_OUTPUT
          echo "url=$LATEST_URL" >> $GITHUB_OUTPUT

      # 3. 读取历史版本号
      - name: Get last notified version
        id: get-last
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          RESPONSE=$(curl -s -w "%{http_code}" -H "Authorization: token $PAT_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/variables/OPENCLAW_LAST_VERSION")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | head -n -1)
          LAST_VERSION=""
          if [ "$HTTP_CODE" = "200" ]; then
            LAST_VERSION=$(echo "$RESPONSE_BODY" | jq -r '.value // ""')
          fi
          echo "last_version=$LAST_VERSION" >> $GITHUB_OUTPUT
          echo "上次推送版本：$LAST_VERSION"

      # 4. 发送完整翻译内容到钉钉（格式美观+换行生效）
      - name: Send full translated content to DingTalk
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          LATEST_VERSION: ${{ steps.get-latest.outputs.latest_version }}
          LAST_VERSION: ${{ steps.get-last.outputs.last_version }}
          TITLE_CN: ${{ steps.get-latest.outputs.title_cn }}
          BODY_CN: ${{ steps.get-latest.outputs.body_cn }}
          URL: ${{ steps.get-latest.outputs.url }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$LATEST_VERSION" != "null" ] && [ "$LATEST_VERSION" != "$LAST_VERSION" ]; then
            echo "检测到新版本 $LATEST_VERSION，推送完整翻译内容到钉钉..."
            
            # 构造钉钉消息（换行符正常生效）
            JSON_PAYLOAD=$(jq -n \
              --arg ver "$LATEST_VERSION" \
              --arg title "$TITLE_CN" \
              --arg body "$BODY_CN" \
              --arg url "$URL" \
              '{
                "msgtype":"text",
                "text":{"content":"🚨 OpenClaw 原仓库新版本发布 🚨\n版本号：\($ver)\n版本标题：\($title)\n\n更新内容（完整翻译）：\n\($body)\n\n查看完整详情：\($url)"}
              }')

            # 发送钉钉通知
            curl -X POST "$DINGTALK_WEBHOOK" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "$JSON_PAYLOAD"

            # 更新版本号变量
            curl -s -X DELETE -H "Authorization: token $PAT_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/variables/OPENCLAW_LAST_VERSION"
            curl -s -X POST -H "Authorization: token $PAT_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/actions/variables" \
              -d '{"name":"OPENCLAW_LAST_VERSION","value":"'$LATEST_VERSION'"}'
            
            echo "完整翻译内容已推送至钉钉，版本号已保存"
          else
            echo "无新版本（当前版本：$LATEST_VERSION），无需推送"
          fi
